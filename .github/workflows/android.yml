name: Android

# Build + test Android (ubuntu-arm) and compile the shared Kotlin for iOS (macOS).
# Lint is intentionally not a gate (currently red: see #23). Public repo, so all
# runners are free — ARM is chosen for speed, not cost.
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the release job attaches the APK to a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the obsolete 'tools' package (removed from the SDK repo) → sdkmanager fails.
          # Install exactly what the build needs instead.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + run host tests
        run: ./gradlew :androidApp:assembleDebug :composeApp:testAndroidHostTest --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pillion-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  ios-compile:
    # Shared Kotlin must also compile for Kotlin/Native (iOS). Catches JVM-only APIs leaking into
    # commonMain (e.g. javaClass, Dispatchers.IO) that the Android build happily accepts.
    # NOTE: no Apple DEV cert / provisioning / TestFlight in CI — distribution is via SideStore
    # (on-device re-sign). A future IPA job must follow iosApp/build-ipa.sh, NOT just build unsigned:
    # Xcode build with CODE_SIGNING_ALLOWED=NO, then ad-hoc sign inside-out (appex first) WITH
    # --entitlements so the App Group survives and the re-signer replaces (not synthesizes) the appex
    # seal. A fully-unsigned IPA SIGKILLs the broadcast extension and strips the App Group.
    # This job is Kotlin/Native compile-only and produces no IPA.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile shared Kotlin for iOS simulator
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace --no-daemon

  release:
    # Runs only when a v* tag is pushed, so an alpha is cut deliberately, never on every commit.
    # Builds a RELEASE APK signed with the project cert (pillion-release.jks) from repo secrets, so
    # every alpha shares one signature and installs over the previous one. Requires these secrets:
    #   ANDROID_KEYSTORE_BASE64   - `base64 -i pillion-release.jks` of the .jks
    #   ANDROID_KEYSTORE_PASSWORD - store password
    #   ANDROID_KEY_ALIAS         - key alias
    #   ANDROID_KEY_PASSWORD      - key password
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 not set — refusing to publish an unsigned alpha." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > pillion-release.jks
          { echo "storeFile=pillion-release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"; } > keystore.properties
      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace --no-daemon
      - name: Verify the APK is signed with the release cert
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
      - name: Clean up signing material
        if: always()
        run: rm -f pillion-release.jks keystore.properties
      - name: Create GitHub pre-release with the signed APK
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
